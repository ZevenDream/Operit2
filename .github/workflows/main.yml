name: DSH Build Android APK

# 在 GitHub 托管 runner 上编译 Operit2 的 arm64-v8a release APK。
# 与仓库自带 android-flutter-build.yml 的唯一区别：不读 4 个签名 secret，
# 而是在 runner 内部用 keytool 现场生成自签名 keystore，因此零 secret 也能出包。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bzip2 ca-certificates curl diffutils flex \
            gawk gzip patch pkg-config tar unzip xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 3

  build-android:
    needs: build-android-runtime
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_ENABLE_STRICT: "0"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) { throw "libclang missing at $libclang" }

      - name: Prepare Python virtual environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe --version

      - name: Prepare repository TypeScript compiler
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .\.ci-tools\typescript\node_modules\.bin\tsc.cmd --version

      - name: Generate self-signed Android signing material
        run: |
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          $pass = "operit2local"
          $alias = "operit2"
          $keytool = if ($env:JAVA_HOME -and (Test-Path (Join-Path $env:JAVA_HOME "bin\keytool.exe"))) { Join-Path $env:JAVA_HOME "bin\keytool.exe" } else { "keytool" }
          Write-Host "keytool: $keytool"
          $dname = "CN=Operit2 Local Build,O=Local,C=CN"
          & $keytool -genkeypair -v -keystore $keystore -storetype PKCS12 -storepass $pass -keypass $pass -alias $alias -keyalg RSA -keysize 2048 -validity 10000 -dname $dname
          if ($LASTEXITCODE -ne 0) { throw "keytool failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $keystore)) { throw "keystore not created: $keystore" }
          $content = "RELEASE_STORE_FILE=operit2-release.keystore`nRELEASE_STORE_PASSWORD=$pass`nRELEASE_KEY_ALIAS=$alias`nRELEASE_KEY_PASSWORD=$pass`n"
          [System.IO.File]::WriteAllText((Join-Path $secretsDir "android-signing.properties"), $content, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content (Join-Path $secretsDir "android-signing.properties")

      - name: Check build environment
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Build and package Android app
        run: |
          $line = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches[0]
          python tools/build_scripts/build_flutter_android.py --build-name $line.Groups[1].Value --build-number $line.Groups[2].Value --enforce-lockfile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operit2-apk-arm64-v8a
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
